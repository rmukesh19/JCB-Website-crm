    <!-- Async Storage Sync: Bridge API leads data into localStorage for dashboard KPIs -->
    <script>
      (function syncLeadsToLocalStorage() {
        function doSync() {
          var token = localStorage.getItem('jcb360_token');
          if (!token) return; // Not logged in yet, skip
          fetch('/api/crm/leads', {
            headers: { 'Content-Type': 'application/json', 'Authorization': token }
          })
            .then(function(res) { return res.ok ? res.json() : null; })
            .then(function(data) {
              if (!data) return;
              var leads = Array.isArray(data) ? data : (data.leads || data.data || []);
              if (leads.length > 0) {
                try {
                  localStorage.setItem('jcb360_crm_leads_v2', JSON.stringify(leads));
                  localStorage.setItem('jcb360_crm_leads', JSON.stringify(leads));
                } catch(e) {}
              }
            })
            .catch(function() {});
        }
        // Sync after a short delay (allow app to login/restore session first)
        setTimeout(doSync, 1500);
        // Re-sync every 20 seconds to keep dashboard KPIs fresh
        setInterval(doSync, 20000);
      })();
    </script>
