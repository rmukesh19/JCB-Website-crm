    <!-- Immediate Client-Side Cache Purge for Pristine Fresh Start -->
    <script>
      (function purgeClientStorage() {
        var CLEAN_SLATE_KEY = 'jcb360_clean_slate_20261124_v4';
        if (localStorage.getItem(CLEAN_SLATE_KEY) !== 'true') {
          try {
            ['jcb360_crm_leads', 'jcb360_crm_leads_v2', 'jcb360_leads'].forEach(function(k) {
              localStorage.removeItem(k);
            });
            localStorage.setItem(CLEAN_SLATE_KEY, 'true');
          } catch(e) {}
        }
      })();
    </script>

    <!-- Leak-Free Visibility-Aware CRM Leads Sync -->
    <script>
      (function syncLeadsToLocalStorage() {
        var timer = null;
        function doSync() {
          // Skip network request and V8 allocation if document is hidden/backgrounded
          if (document.hidden) return;

          var token = localStorage.getItem('jcb360_token');
          if (!token) return;

          fetch('/api/crm/leads', {
            headers: { 'Content-Type': 'application/json', 'Authorization': token }
          })
            .then(function(res) {
              if (res.status === 401 || res.status === 403) {
                // Token expired/invalid: halt polling loop to prevent infinite request leak
                if (timer) clearInterval(timer);
                return null;
              }
              return res.ok ? res.json() : null;
            })
            .then(function(data) {
              if (!data) return;
              var leads = Array.isArray(data) ? data : (data.leads || data.data || []);
              try {
                localStorage.setItem('jcb360_crm_leads_v2', JSON.stringify(leads));
                localStorage.setItem('jcb360_crm_leads', JSON.stringify(leads));
              } catch(e) {}
            })
            .catch(function() {});
        }

        // Initial sync with cleanup listeners
        setTimeout(doSync, 1500);
        timer = setInterval(doSync, 30000);

        document.addEventListener('visibilitychange', function() {
          if (!document.hidden) doSync();
        });

        window.addEventListener('beforeunload', function() {
          if (timer) clearInterval(timer);
        });
      })();
    </script>
